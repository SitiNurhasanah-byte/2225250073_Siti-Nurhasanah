# Konfigurasi hosting Netlify (alamat *.netlify.app).
# Unggah dari laptop: npm run deploy
[build]
  command = "npm run build"
  publish = "dist"

# Service worker & halaman utama selalu dicek ulang agar pembaruan cepat sampai ke siswa.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# File hasil build bernama unik (hash), aman disimpan lama.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
